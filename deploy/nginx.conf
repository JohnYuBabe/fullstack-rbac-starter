# ---------------------------------------------------------------
# /rbac/ 子路径片段
#
# 注意：不要用这份文件覆盖站点配置。
# 站点里通常还有别的 location（例如 /console/），整份替换会把它们一起弄没。
#
# 用法二选一：
#   1. 自动插入（推荐，失败会回滚）：
#      sudo python3 deploy/apply-nginx.py --config <站点配置> --server-name <域名>
#   2. 手工：把下面的 location 块粘进 443 server 块的末尾，然后
#      nginx -t && nginx -s reload
#
# 静态文件位置：/var/www/rbac/（apps/web/dist 的内容）
# 后端：127.0.0.1:3020
#
# 安全响应头（CSP / HSTS / X-Frame-Options …）由外层 server 块统一下发，
# 所以这些 location 里只用 expires，绝不能再写 add_header —— 一旦某个
# location 出现 add_header，外层 server 块的 add_header 对该 location 全部失效。
#
# 关于 ^~：宝塔默认配置通常带 `location ~ .*\.(js|css)?$` 一类正则 location。
# nginx 选中最长前缀后，仍会按顺序尝试全部正则，正则命中就压过普通前缀
# （与书写顺序无关）。因此 /rbac/assets/ 与 /rbac/api/ 必须用 ^~，
# 否则静态资源会被外层正则截走、从站点根取文件，页面白屏。
# ---------------------------------------------------------------

    # 缺少结尾斜杠会导致相对资源解析错误，补一个 301，并保留查询串
    location = /rbac {
        return 301 /rbac/$is_args$args;
    }

    # /rbac 下先拦敏感路径，否则会被 SPA 回退当成前端路由返回 200
    # ~* 大小写不敏感：/rbac/foo.PHP 同样 404
    location ~* ^/rbac/(\.|.*\.(php|jsp|asp|aspx|env|ini|log|sql|sqlite|db|bak|old|swp|map|gz|tgz|zip|tar|pem|key|crt|ya?ml|conf|sh|py|rb)$) {
        return 404;
    }

    location = /rbac/favicon.svg {
        root /var/www;
        expires 1d;
    }

    # 健康检查：走真实 API（含数据库 ping），不是静态 ok
    location = /rbac/healthz {
        access_log off;
        proxy_pass http://127.0.0.1:3020/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # 带尾斜杠的探针地址显式 404，避免被 SPA 回退成 200 而误报健康
    location = /rbac/healthz/ {
        return 404;
    }

    # 后端 API：剥掉 /rbac 前缀，保留 /api
    location ^~ /rbac/api/ {
        proxy_pass http://127.0.0.1:3020/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 带内容哈希的静态资源长缓存
    # ^~ 会跳过外层正则，所以敏感后缀在这里再拦一层
    location ^~ /rbac/assets/ {
        root /var/www;
        expires 30d;
        try_files $uri =404;

        location ~* \.(php|jsp|asp|aspx|env|ini|log|sql|bak|old|swp|map|yml|yaml|conf|sh|py)$ {
            return 404;
        }
    }

    # 入口 HTML 不缓存，保证发版后立刻拿到新的资源引用
    location = /rbac/index.html {
        root /var/www;
        expires -1;
    }

    # SPA 路由回退
    location /rbac/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /rbac/index.html;
    }
